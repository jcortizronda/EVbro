# Development repository: the image is published as `evbro` (private). tools/publish.sh rewrites it to `evbro` for the public repository.
name: Imagen Docker

# Publishes the server image to the GitHub Container Registry so people can self-host without the source tree:
#   ghcr.io/<owner>/evbro:latest   (every push to main)
#   ghcr.io/<owner>/evbro:vX.Y.Z   (every tag vX.Y.Z) and :sha-<short>
# The package is private until it is made public once in GitHub → Packages → evbro → Package settings → Change visibility.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/evbro
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: EVBRO_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
