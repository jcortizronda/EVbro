# Alembic (schema migrations). Run from backend/ with the virtualenv active:
#   alembic current            alembic upgrade head            alembic revision -m "add x to y"
# The database URL comes from the app settings (DATABASE_URL / .env), not from this file. The app applies `upgrade head` itself at
# startup (db/migrate.py), so the commands above are for development and for checking a server by hand.
[alembic]
script_location = %(here)s/src/app/db/migrations
prepend_sys_path = %(here)s/src
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
